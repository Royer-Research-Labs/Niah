# LM Evaluation Harness task: NIAH as a multiple-choice retrieval eval.
#
# Build the dataset first (keep --tokens below the model block_size; the demo is 256):
#   python lm_eval_harness/build_dataset.py --tokens 192 --samples 5 --choices 4 \
#       --out lm_eval_harness/data/niah_192.jsonl
#
# Then run (note --include_path so lm-eval discovers this task + the nanogpt model):
#   lm_eval --model nanogpt \
#           --model_args ckpt=out-niah-demo/ckpt.pt,device=cpu,tokenizer=gpt2 \
#           --tasks niah --include_path lm_eval_harness --limit 20
#
# The model picks, for each row, the choice with the highest log-likelihood
# continuation of `context`. `acc` is exact-match against the gold needle.

# `niah_nanogpt` (not `niah`) to avoid colliding with lm-eval's built-in NIAH suite.
task: niah_nanogpt
dataset_path: json
dataset_name: null
dataset_kwargs:
  data_files:
    test: lm_eval_harness/data/niah_192.jsonl
test_split: test
output_type: multiple_choice

doc_to_text: "{{context}}"
doc_to_choice: "{{choices}}"
doc_to_target: "{{gold}}"

metric_list:
  - metric: acc
    aggregation: mean
    higher_is_better: true

metadata:
  version: 1.0
